<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARMORA – Smart Agriculture & Farmer Empowerment Platform</title>
  <meta name="description" content="Intelligent agricultural technology platform for precision water management, instant mobile crop disease diagnosis, bilingual Tamil/English voice assistance, and circular agro-waste monetization.">
  <meta name="keywords" content="AgriTech, Smart Agriculture, WaterWise AI, MandiMate AI, Farm Voice, Waste to Wealth, Tamil Nadu, Precision Farming, ICAR, TNAU">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans, Inter, Mukta Malar (Tamil) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Mukta+Malar:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            },
            cream: {
              50: '#fdfbf7',
              100: '#fbf9f4',
              200: '#f7f4ea',
              300: '#e8e2d2',
              400: '#d5ccb6',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '"Mukta Malar"', 'sans-serif'],
            tamil: ['"Mukta Malar"', '"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#fbf9f4] text-stone-900 antialiased selection:bg-emerald-200 selection:text-emerald-950">
  <!-- React Root Mount -->
  <div id="root">
    <!-- Initial Loading State -->
    <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#fbf9f4]">
      <div class="w-16 h-16 rounded-2xl bg-emerald-800 text-white flex items-center justify-center text-3xl shadow-xl animate-bounce mb-4">
        🌱
      </div>
      <h1 class="text-2xl font-black text-emerald-950 tracking-tight">FARMORA</h1>
      <p className="text-xs text-stone-500 font-semibold mt-1">Smart Agriculture & Farmer Empowerment</p>
      <div class="w-48 bg-stone-200 h-1.5 rounded-full overflow-hidden mt-4">
        <div class="bg-emerald-600 h-full w-2/3 animate-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Application Data Modules -->
  <script src="js/translations.js"></script>
  <script src="js/data/cropsData.js"></script>
  <script src="js/data/diseasesData.js"></script>
  <script src="js/data/wasteData.js"></script>
  <script src="js/data/mandiData.js"></script>
  <script src="js/data/weatherData.js"></script>

  <!-- React Components (Compiled via Babel) -->
  <script type="text/babel" src="js/components/Navbar.js"></script>
  <script type="text/babel" src="js/components/Hero.js"></script>
  <script type="text/babel" src="js/components/WaterWiseAI.js"></script>
  <script type="text/babel" src="js/components/MandiMateAI.js"></script>
  <script type="text/babel" src="js/components/CropDoctorAI.js"></script>
  <script type="text/babel" src="js/components/FarmVoice.js"></script>
  <script type="text/babel" src="js/components/WasteToWealth.js"></script>
  <script type="text/babel" src="js/components/FarmerDashboard.js"></script>
  <script type="text/babel" src="js/components/MandiWeather.js"></script>
  <script type="text/babel" src="js/components/CropCalendar.js"></script>
  <script type="text/babel" src="js/components/AuthModal.js"></script>
  <script type="text/babel" src="js/components/AboutContact.js"></script>
  <script type="text/babel" src="js/components/Footer.js"></script>

  <!-- Master Application Script -->
  <script type="text/babel" src="js/App.js"></script>
</body>
</html>
